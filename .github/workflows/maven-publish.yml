name: Publish Maven Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.1.0). Leave empty to derive from tag.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(mvn -q -f llmwiki/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
            VERSION="${VERSION%%-SNAPSHOT}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Unable to determine release version"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Maven settings for GitHub Packages
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Set release version
        run: mvn -f llmwiki/pom.xml versions:set -DnewVersion=${{ steps.version.outputs.value }} -DprocessAllModules -DgenerateBackupPoms=false

      - name: Deploy to GitHub Packages
        run: mvn -f llmwiki/pom.xml deploy -DskipTests