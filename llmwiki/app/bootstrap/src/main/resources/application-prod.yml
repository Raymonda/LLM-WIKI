# 仅保留 prod 相对基础配置的差异项（容器服务地址、RocketMQ 默认开启、S3 存储等）

spring:
  autoconfigure:
    exclude: []
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:llmwiki}?autoReconnect=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

llmwiki:
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:true}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    s3:
      endpoint: ${S3_ENDPOINT:http://minio:9000}
  elasticsearch:
    uris: ${ES_URIS:http://elasticsearch:9200}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:rocketmq-namesrv:9876}

logging:
  level:
    org.cn.liuwt.llmwiki: INFO
    org.springframework.data.elasticsearch: WARN
